name: Check

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Check generated catalogs
        run: python3 tools/validate_catalog.py --check --all
